[project]
name = "climate-finance"
version = "2.0.0.dev0"
description = "Climate finance figures from OECD and UNFCCC data, traced to the project"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jorge Rivera", email = "jorge.rivera@one.org" }]
keywords = ["climate", "finance", "data", "oecd", "unfccc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "httpx>=0.28.1",
    "narwhals>=2.27.1",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pydeflate>=2.6.1",
    "rich>=15.0.0",
]

[project.optional-dependencies]
build = [
    "typer>=0.27.3",
]
compat = [
    "pandas>=2.3",
]

[project.scripts]
cf-build = "climate_finance.build.cli:app"

[project.urls]
Homepage = "https://github.com/ONEcampaign/climate-finance-package"
Repository = "https://github.com/ONEcampaign/climate-finance-package"
Issues = "https://github.com/ONEcampaign/climate-finance-package/issues"

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[tool.uv.build-backend]
module-root = "src"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "B", "UP", "SIM", "RUF", "PERF", "C4", "RET", "PIE", "FURB", "TRY", "I",
]
# Exception messages name the owning slice or the offending columns inline.
ignore = ["TRY003"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs real data under CF_E2E_DATA",
    "integration: reaches the network or a live model",
]
addopts = ["--strict-markers", "--tb=short"]
