[project]
name = "climate-finance"
version = "2.0.0.dev0"
description = "Climate finance figures from OECD and UNFCCC data, traced to the project"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jorge Rivera", email = "jorge.rivera@one.org" }]
keywords = ["climate", "finance", "data", "oecd", "unfccc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "polars>=2.0.0",
    "pyarrow>=16.1.0",
    "pydantic>=2.10.0",
    "pydeflate>=2.6.2",
]

[project.optional-dependencies]
build = [
    "duckdb>=1.4.1,<2",
    "httpx>=0.27.0",
    "numpy>=2.3.3",
    "oda-reader>=1.12.0",
    "openpyxl>=3.0.10",
    "pyyaml>=6.0.1",
    "rapidfuzz>=3.8.0",
    "resolvekit>=0.1.13",
    "rich>=13.8.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.16.2",
    "splink>=5.0.0,<6",
    "threadpoolctl>=3.1.0",
    "typer>=0.16.0",
]
compat = [
    "pandas>=2.2.2",
]
# The embedding model behind the blocking's embedding neighbours (`embed = true`).
embed = [
    "sentence-transformers>=6.2.0",
]

[project.scripts]
cf-build = "climate_finance.build.cli:app"

[project.urls]
Homepage = "https://github.com/ONEcampaign/climate-finance-package"
Repository = "https://github.com/ONEcampaign/climate-finance-package"
Issues = "https://github.com/ONEcampaign/climate-finance-package/issues"

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[tool.uv.build-backend]
module-root = "src"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "B", "UP", "SIM", "RUF", "PERF", "C4", "RET", "PIE", "FURB", "TRY", "I",
]
# Exception messages name the offending columns inline.
ignore = ["TRY003"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
# The `embed` extra's model library, absent from a venv without that extra.
allowed-unresolved-imports = ["sentence_transformers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs real data under CF_E2E_DATA",
    "integration: reaches the network or a live model",
]
addopts = ["--strict-markers", "--tb=short"]
