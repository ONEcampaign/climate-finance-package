# cf-build configuration. Relative paths resolve against this file. The switches are
# those of a published release, which `cf-build publish` checks.

offline = false
# Key-repair rules: new crs id under one project number, project-number variants,
# World Bank parent projects, AfDB scientific notation, unique title and recipient.
key_repair = true
# Recovery routes: DFI aggregate rebuild, EIB project-list rules, GCF and GEF joins.
recoveries = true
# Bank-ledger gap fill and the GCF and GEF routes (the fill stage). Off passes
# allocations and commitments through unchanged.
gap_fill = false
# Ledger check, review queue and pending status (the review stage). Off passes links
# and commitments through unchanged.
review = true
# Jev objective labels on linked records, and the level map behind relevance="jev".
jev_labels = false
# Jev flags on climate-marked CRS records from jev_flags_first_year.
jev_flags = true
# Jev on the classifier's band ([jev] band), Jev labels on each Splink model's
# calibration sample, and Splink links. Off leaves the link stage's tables unchanged.
jev_links = true
# Embedding neighbours as a further blocking rule. Needs the `embed` extra unless the
# embedding cache holds every vector the build asks for.
embed = false

[years]
# Every year the recipient-perspective CRDF holds, or an inclusive [first, last].
# The CRS years follow: the first CRDF year, or the year before where the CRDF holds
# it, to the CRS file's last, unless `crs` sets an inclusive [first, last].
crdf = "all"
# The last CRS year every provider has reported; later years hold early reports.
crs_last_complete = 2024

[sources]
crs_version = "v20261006"
# The bulk CRS parquet, downloaded by browser. Without it, fetch downloads the file.
crs_file = { path = "data/raw/oecd/CRS_v20261006.parquet", sha256 = "d24840a5fad50e718da4eb5831c3e1e333e7c5ef6b46c158e3510c7497518f06" }
# Archived IATI activity XML, one directory per publisher.
iati_archive = "data/raw/external/iati"
iati_publishers = ["caf", "eib", "gcf", "gef", "idbinvest", "ifcwbg"]
btr_archive = "data/raw/unfccc_btr1"
review_decisions = "data/review_decisions.parquet"
# Weikmans et al.'s human-coded adaptation levels; they fit the Jev level map and are
# never published.
adaptation_labels = { path = "data/raw/classifiers/toetzke/wk.csv", sha256 = "6eafebb197764603754cbaddeef4534b62fefcadfc439e1f67c7f2dbad61e218" }

# Bank ledgers for the review stage's ledger check. Without this section, fetch and
# normalise skip them. `archive` is a local copy laid out as raw/ledgers/.
[sources.ledgers]
years = [2021, 2024]
publishers = ["ibrd", "ida", "asdb", "afdb", "iadb", "isdb", "ebrd", "bcie", "gcf", "gef"]

# CRDF file name -> ETag of the pinned copy.
[sources.crdf_etags]

[jev]
model = "jev-1.14.0"
cost_cap_usd = 10.0
# Calibrated probabilities in [low, high) go to Jev.
band = [0.3, 0.9]
cache_dir = "data/jev-cache"

[embedding]
model = "intfloat/multilingual-e5-small"
revision = "614241f622f53c4eeff9890bdc4f31cfecc418b3"
cache_dir = "data/embedding-cache"

# Why a provider-year total moved more than the drift gate allows, one entry per
# release, provider and year:
# [[drift_causes]]
# release = "2026b"
# provider_code = 4
# year = 2023
# cause = "France revised its 2023 CRS reporting"

# Known gaps between Eurostat's sdg_13_50 lines and the release that the
# eurostat_reconciliation gate allows, one entry per line and year, with the gap as
# Eurostat's figure less the release's in EUR, measured on the 2026a-rc3 build.
# "not traced" marks a gap whose cause nobody has traced yet.
