# The coefficients each provider applies to Rio-marked activities when it reports
# climate finance to the UNFCCC, keyed by ISO 3 code (EUU for EU Institutions). Each
# entry is one row of the release's `provider_coefficients` table, with the same
# columns; a missing `agency_code`, `first_year`, `last_year` or `both_significant`
# is null, and a missing `case_by_case` is false.
#
# The survey is the OECD's "Results of the survey on the coefficients applied to
# Climate Change Rio marker data when reporting to the UNFCCC",
# DCD/DAC/STAT(2024)28/REV1, which covers the 2021-22 data members reported in their
# first BTRs; its rows apply to every year. Korea and Monaco are not in it, so they
# have no row.
AUS:
  # Case by case, with 30% where an activity's share cannot be estimated.
  - {significant: 0.3, principal: 1.0, case_by_case: true,
     source: OECD DCD/DAC/STAT(2024)28/REV1, locator: "Table 1, p. 8, and p. 5"}
AUT:
  - {significant: 0.5, principal: 1.0,
     source: OECD DCD/DAC/STAT(2024)28/REV1, locator: "Table 1, p. 8"}
BEL:
  - {case_by_case: true,
     source: OECD DCD/DAC/STAT(2024)28/REV1, locator: "Table 1, p. 8, and p. 5"}
CAN:
  - {significant: 0.3, principal: 1.0,
     source: OECD DCD/DAC/STAT(2024)28/REV1, locator: "Table 1, p. 8"}
  # FinDev Canada and Export Development Canada follow IFC principles.
  - {agency_code: 22, case_by_case: true,
     source: OECD DCD/DAC/STAT(2024)28/REV1, locator: "notes b to d, p. 9"}
  - {agency_code: 31, case_by_case: true,
     source: OECD DCD/DAC/STAT(2024)28/REV1, locator: "notes b to d, p. 9"}
CHE:
  - {significant: 0.5, principal: 0.85,
     source: OECD DCD/DAC/STAT(2024)28/REV1, locator: "Table 1, p. 8, and note m, p. 9"}
CZE:
  - {significant: 1.0, principal: 1.0,
     source: OECD DCD/DAC/STAT(2024)28/REV1, locator: "Table 1, p. 8"}
DEU:
  # An activity significant for both objectives counts in full.
  - {significant: 0.5, principal: 1.0, both_significant: 1.0,
     source: OECD DCD/DAC/STAT(2024)28/REV1, locator: "Table 1, p. 8, and note g, p. 9"}
DNK:
  - {significant: 0.5, principal: 1.0,
     source: OECD DCD/DAC/STAT(2024)28/REV1, locator: "Table 1, p. 8"}
ESP:
  - {significant: 0.5, principal: 1.0,
     source: OECD DCD/DAC/STAT(2024)28/REV1, locator: "Table 1, p. 8, and note l, p. 9"}
EST:
