LUX:
  # Not in the survey. Assesses each activity rather than classifying it by Rio
  # marker, and counts Significant activities only in exceptional cases, so it
  # states no flat coefficient. Its linked BTR-to-CRS pairs sit at 40% of the CRS
  # amount.
  - {case_by_case: true,
     source: "First Biennial Transparency Report of Luxembourg (2025)",
     locator: "section V.A.1, paragraphs 43 to 46"}
