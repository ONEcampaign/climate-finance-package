<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Label the blind sample</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --line: #8885; --soft: #8881; --muted: #777; --accent: #1c6ed5;
    --diff: #fff1b8; --bad: #c62828; --yes: #1b7f3b; --no: #b3261e;
  }
  @media (prefers-color-scheme: dark) { :root { --diff: #5a4a00; --bad: #ff8a80; --muted: #999; } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0 auto; max-width: 1320px; padding: 8px 16px 140px; }
  h1 { font-size: 24px; margin: 4px 0 6px; }
  .guide { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; font-size: 13px; margin-bottom: 6px; }
  .guide h2 { font-size: 13px; margin: 0 0 2px; }
  .guide ul { margin: 0; padding-left: 18px; }
  .guide .yes h2 { color: var(--yes); }
  .guide .no h2 { color: var(--no); }
  .progress { display: flex; justify-content: space-between; gap: 16px; font-size: 13px; padding-top: 6px; border-top: 1px solid var(--line); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 4px 0 2px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; }
  details.small { font-size: 12px; color: var(--muted); display: inline-block; margin-right: 18px; vertical-align: top; }
  details.small ul { columns: 3; margin: 4px 0; padding-left: 18px; }
  summary { cursor: pointer; }
  .context { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 8px 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); }
  .context .bad { color: var(--bad); font-weight: 600; }
  .context b { font-weight: 600; margin-right: 4px; }
  .context .answered { margin-left: auto; font-weight: 600; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 10px; min-width: 0; }
  .card h2 { font-size: 15px; margin: 0 0 6px; }
  .card.a h2 { color: #1c6ed5; }
  .card.b h2 { color: #b45f06; }
  dl { display: grid; grid-template-columns: 7.5em 1fr; gap: 3px 10px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  dd.diff { background: var(--diff); border-radius: 3px; padding: 0 4px; }
  dd.title { font-weight: 600; font-size: 15px; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .clamp.open { display: block; cursor: default; }
  .more { color: var(--accent); font-size: 12px; cursor: pointer; }
  .same, .checks { margin-top: 8px; font-size: 13px; }
  .same table, .checks table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 4px; }
  .same td, .checks td, .checks th { border: 1px solid var(--line); padding: 2px 6px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
  .checks .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ref { color: var(--muted); font-size: 11px; margin-top: 10px; }
  .answer { position: fixed; left: 0; right: 0; bottom: 0; background: Canvas; border-top: 1px solid var(--line); padding: 8px 16px 10px; z-index: 3; }
  .answer > div { max-width: 1320px; margin: 0 auto; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr 0.6fr; gap: 10px; }
  .buttons button { font: inherit; font-size: 17px; font-weight: 600; padding: 12px 8px; border: 2px solid var(--line); border-radius: 8px; background: ButtonFace; color: ButtonText; cursor: pointer; }
  #yes { border-color: var(--yes); } #yes.on, #yes:hover { background: var(--yes); color: #fff; }
  #no { border-color: var(--no); } #no.on, #no:hover { background: var(--no); color: #fff; }
  #tell:hover { background: var(--line); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 5px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .hint input { flex: 1; min-width: 260px; font: inherit; padding: 4px 8px; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  #toast { position: fixed; left: 50%; bottom: 118px; transform: translateX(-50%); background: #222; color: #fff; padding: 6px 14px; border-radius: 16px; font-size: 13px; z-index: 4; }
  #toast a { color: #8ab4f8; cursor: pointer; margin-left: 8px; text-decoration: underline; }
  #error { color: var(--bad); font-weight: 600; }
  .kind { color: var(--muted); font-size: 11px; }
  .done { text-align: center; margin: 60px 0; font-size: 18px; }
  #loading { text-align: center; margin: 60px 0; font-size: 18px; color: var(--muted); }
  #loading.failed { color: var(--bad); font-weight: 600; }
</style>
</head>
<body>
<h1 id="heading"></h1>
<div class="guide">
  <div class="yes"><h2 id="yes-title"></h2><ul id="yes-items"></ul></div>
  <div class="no"><h2>No</h2><ul id="no-items"></ul></div>
</div>
<div class="progress"><span id="where"></span><span id="left"></span></div>
<div class="bar"><div id="fill"></div></div>
<details class="small"><summary>By provider</summary><ul id="providers"></ul></details>
<details class="small"><summary>The full matching rule</summary><p id="rule"></p></details>
<div id="loading">Loading the first pair&hellip;</div>
<main id="pair"></main>
<div id="toast" hidden></div>
<div class="answer"><div>
  <div class="buttons">
    <button id="yes">Yes (Y)</button>
    <button id="no">No (N)</button>
    <button id="tell">Can't tell (U)</button>
  </div>
  <div class="hint">
    <span><kbd>Shift</kbd>+<kbd>Y</kbd> or <kbd>N</kbd>: low confidence</span>
    <span><kbd>R</kbd>: add a reason</span>
    <span><kbd>&larr;</kbd>: back</span>
    <span>Can't tell sets the pair aside; it comes back after the others.</span>
    <input type="text" id="reason" placeholder="Reason; press Enter, then Y or N" hidden>
    <span id="error"></span>
  </div>
</div></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const LONG = new Set(["Short description", "Long description"]);
// Rows whose difference tells the reader nothing: A is the later record by definition.
const EXPECTED = new Set(["Record year", "Commitment", "Disbursement"]);
// Rows shown only when the two records differ.
const OPTIONAL = ["crs id", "Project number", "Flow", "Purpose", "Channel", "CRS rows summed", "Short description", "Long description"];
let state = null, index = 0, data = null, busy = false, toastTimer = null, loaded = false;

async function api(path, body) {
  const response = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
  });
  const payload = await response.json();
  if (!response.ok) throw new Error(payload.error || response.statusText);
  return payload;
}

function el(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}

function timeLeft(seconds) {
  if (seconds == null) return "";
  if (seconds < 90) return "under a minute left";
  const minutes = Math.round(seconds / 60);
  if (minutes < 90) return `about ${minutes} minutes left at your pace`;
  return `about ${Math.round(seconds / 360) / 10} hours left at your pace`;
}

function showState(next) {
  state = next;
  const page = state.page;
  $("heading").textContent = page.heading;
  $("yes-title").textContent = page.yes;
  $("yes").textContent = `${page.yes} (Y)`;
  $("yes-items").replaceChildren(...page.yes_items.map((item) => el("li", item)));
  $("no-items").replaceChildren(...page.no_items.map((item) => el("li", item)));
  $("rule").textContent = state.definition;
  $("fill").style.width = `${state.total ? (100 * state.done) / state.total : 100}%`;
  $("providers").replaceChildren(...state.providers.map(
    (p) => el("li", `${p.name ?? p.provider}: ${p.done} of ${p.total}`)));
  $("left").textContent = [
    `${state.done.toLocaleString()} of ${state.total.toLocaleString()} decided`,
    state.skipped ? `${state.skipped} set aside` : "",
    timeLeft(state.seconds_left),
  ].filter(Boolean).join(" · ");
}

function showWhere() {
  const where = $("where");
  const mine = data && state.providers.find((p) => p.provider === data.provider);
  where.textContent = data
    ? `Pair ${(index + 1).toLocaleString()} of ${state.total.toLocaleString()}` +
      (mine ? ` \u00b7 ${mine.name ?? mine.provider}: ${mine.done} of ${mine.total} decided` : "")
    : "";
  if (data && data.kind) where.append(" ", el("small", data.kind, "kind"));
}

function fieldMap(pair) {
  const map = new Map();
  for (const [name, a, b] of pair.view.fields) map.set(name, [a, b]);
  map.set("Similar commitments", pair.view.similar.map(String));
  return map;
}

function contextLine(fields, answer) {
  const line = el("div", undefined, "context");
  for (const name of ["Donor", "Agency", "Recipient"]) {
    const [a, b] = fields.get(name);
    const item = el("span", undefined, a === b ? "" : "bad");
    item.append(el("b", a === b ? name : `${name} differs`), a === b ? a : `A: ${a} · B: ${b}`);
    line.append(item);
  }
  if (answer) line.append(answered(answer));
  return line;
}

function answered(answer) {
  const word = answer.label === "match" ? "Yes" : "No";
  const low = answer.strength === "u" || answer.strength === "1" ? " (low confidence)" : "";
  return el("span", `You answered: ${word}${low}`, "answered");
}

function amounts(fields, col) {
  const parts = ["Commitment", "Disbursement"]
    .map((name) => [name, fields.get(name)[col]])
    .filter(([, value]) => value !== "-");
  return parts.length ? parts.map(([name, value]) => `${name} ${value}`).join(" · ") : "-";
}

function addRow(list, label, value, differs, cls) {
  list.append(el("dt", label));
  const dd = el("dd", undefined, [cls, differs ? "diff" : ""].filter(Boolean).join(" "));
  if (LONG.has(label) && value !== "-") {
    const text = el("div", value, "clamp");
    const more = el("span", "more", "more");
    more.onclick = text.onclick = () => {
      text.classList.toggle("open");
      more.textContent = text.classList.contains("open") ? "less" : "more";
    };
    dd.append(text, more);
    queueMicrotask(() => { more.hidden = text.scrollHeight <= text.clientHeight + 1; });
  } else {
    dd.textContent = value;
  }
  list.append(dd);
}

function card(side, fields, shown) {
  const col = side === "A" ? 0 : 1;
  const box = el("section", undefined, `card ${side.toLowerCase()}`);
  box.append(el("h2", state.page.sides[col]));
  const list = el("dl");
  const differs = (name) => !EXPECTED.has(name) && fields.get(name)[0] !== fields.get(name)[1];
  addRow(list, "Year", fields.get("Record year")[col], false);
  addRow(list, "Committed on", fields.get("Commitment date")[col], differs("Commitment date"));
  addRow(list, "Amounts", amounts(fields, col), false);
  addRow(list, "Title", fields.get("Title")[col], differs("Title"), "title");
  for (const name of shown) addRow(list, name, fields.get(name)[col], true);
  box.append(list);
  return box;
}

function sameLine(names, fields) {
  const box = el("details", undefined, "same");
  box.append(el("summary", `Same on both: ${names.map((n) => n.toLowerCase()).join(", ")}`));
  const table = el("table");
  for (const name of names) {
    const tr = el("tr");
    tr.append(el("td", name), el("td", fields.get(name)[0]));
    table.append(tr);
  }
  box.append(table);
  return box;
}

function crsTable(side, rows) {
  const wrap = el("div");
  const more = rows.total > rows.shown.length ? `, first ${rows.shown.length}` : "";
  wrap.append(el("b", `${side}'s CRS rows (${rows.total}${more})`));
  const table = el("table");
  const head = el("tr");
  for (const h of ["Year", "Committed on", "Commitment", "Disbursement", "Title"]) head.append(el("th", h));
  table.append(head);
  for (const row of rows.shown) {
    const tr = el("tr");
    for (const cell of row) tr.append(el("td", cell));
    table.append(tr);
  }
  wrap.append(table);
  return wrap;
}

function checks(pair, fields) {
  const [a, b] = fields.get("Similar commitments");
  const box = el("details", undefined, "checks");
  box.append(el("summary",
    `Other commitments to the same recipient with similar titles: A ${a}, B ${b}. Check B is the right one.`));
  const sides = el("div", undefined, "sides");
  sides.append(crsTable("A", pair.view.rows[0]), crsTable("B", pair.view.rows[1]));
  box.append(sides);
  return box;
}

// A view with no CRS rows (a BTR pair) lists each side's fields as they are,
// marking those the server found to name different things.
function plainCard(side, pair) {
  const col = side === "A" ? 0 : 1;
  const box = el("section", undefined, `card ${side.toLowerCase()}`);
  box.append(el("h2", state.page.sides[col]));
  const list = el("dl");
  for (const [name, a, b] of pair.view.fields) {
    const value = col === 0 ? a : b;
    if (value === "-") continue;
    addRow(list, name, value, pair.view.differs.includes(name), name === "Title" ? "title" : "");
  }
  box.append(list);
  return box;
}

function renderPlain(pair) {
  const cards = el("div", undefined, "cards");
  cards.append(plainCard("A", pair), plainCard("B", pair));
  const line = el("div", undefined, "context");
  if (pair.answer) line.append(answered(pair.answer));
  $("pair").replaceChildren(line, cards, el("div", `Provider ${pair.provider}, pair ${pair.view.pair}`, "ref"));
}

function render(pair) {
  data = pair;
  index = pair.i;
  if (pair.view.rows === undefined) renderPlain(pair);
  else renderTrace(pair);
  const saved = pair.answer;
  $("yes").classList.toggle("on", !!saved && saved.label === "match");
  $("no").classList.toggle("on", !!saved && saved.label === "no_match");
  $("reason").value = saved ? saved.reason : "";
  $("reason").hidden = !(saved && saved.reason);
  $("error").textContent = "";
  showWhere();
  window.scrollTo(0, 0);
  // Warm the server's next chunk of pairs while the person reads this one.
  if (index + 1 < state.total) fetch(`/api/pair?i=${index + 1}`).catch(() => {});
}

function renderTrace(pair) {
  const fields = fieldMap(pair);
  const present = OPTIONAL.filter((name) => fields.has(name) && fields.get(name).some((v) => v !== "-"));
  const differing = present.filter((name) => fields.get(name)[0] !== fields.get(name)[1]);
  const same = present.filter((name) => !differing.includes(name));
  const cards = el("div", undefined, "cards");
  cards.append(card("A", fields, differing), card("B", fields, differing));
  $("pair").replaceChildren(
    contextLine(fields, pair.answer),
    cards,
    ...(same.length ? [sameLine(same, fields)] : []),
    checks(pair, fields),
    el("div", `Provider ${pair.provider}, batch ${pair.batch}, pair ${pair.view.pair}`, "ref"),
  );
}

function status(text, failed) {
  $("loading").textContent = text;
  $("loading").className = failed ? "failed" : "";
  $("loading").hidden = !text;
}

async function load(i) {
  // The first pair reads the CRS rows and can take seconds; later ones are cached.
  const wait = setTimeout(() => status(loaded ? "Loading\u2026" : "Loading the first pair\u2026"), loaded ? 300 : 0);
  try {
    render(await api(`/api/pair?i=${i}`));
    loaded = true;
    status("");
  } catch (e) {
    status(`Could not load the pair: ${e.message}`, true);
  } finally {
    clearTimeout(wait);
  }
}

function toast(text, undoIndex) {
  const box = $("toast");
  const undo = el("a", "Undo");
  undo.onclick = () => { box.hidden = true; load(undoIndex); };
  box.replaceChildren(text, undo);
  box.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.hidden = true; }, 7000);
}

function finish() {
  index = state.total;
  data = null;
  $("pair").replaceChildren(el("div", "Your share is done. Press the left arrow to review your answers.", "done"));
  $("where").textContent = "";
}

async function send(path, body, said) {
  if (busy || !data) return;
  busy = true;
  const from = index;
  try {
    const result = await api(path, {i: index, ...body});
    showState(result.state);
    toast(said, from);
    if (result.next === null) finish();
    else await load(result.next);
  } catch (e) {
    $("error").textContent = e.message;
  } finally {
    busy = false;
  }
}

function answer(label, low) {
  const word = label === "match" ? "Yes" : "No";
  return send("/api/answer", {label, strength: low ? "1" : null, reason: $("reason").value},
    `Saved: ${word}${low ? " (low confidence)" : ""}.`);
}

const tell = () => send("/api/skip", {}, "Set aside; it comes back after the others.");
const go = (i) => { if (i >= 0 && i < state.total) load(i); };

$("yes").onclick = () => answer("match", false);
$("no").onclick = () => answer("no_match", false);
$("tell").onclick = tell;

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target === $("reason")) {
    if (e.key === "Enter" || e.key === "Escape") { e.preventDefault(); $("reason").blur(); }
    return;
  }
  const actions = {
    y: () => answer("match", e.shiftKey), n: () => answer("no_match", e.shiftKey), u: tell,
    r: () => { $("reason").hidden = false; $("reason").focus(); },
    backspace: () => go(index - 1), arrowleft: () => go(index - 1), arrowright: () => go(index + 1),
  };
  const action = actions[e.key.toLowerCase()];
  if (action) { e.preventDefault(); action(); }
});

(async () => {
  try {
    showState(await api("/api/state"));
    if (state.next === null) { status(""); finish(); }
    else await load(state.next);
  } catch (e) {
    status(`Could not load the page: ${e.message}`, true);
  }
})();
</script>
</body>
</html>
