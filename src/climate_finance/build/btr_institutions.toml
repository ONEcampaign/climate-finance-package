# The institution groups of BTR Table III.2, which the normalise stage gives each
# row's `institution` (`btr_multilateral.institution_group`). A group holds the CRS
# channel codes of the Multisystem channel list that its names cover, and no code
# sits in two groups, so a group's core contributions are its codes' sum. The World
# Bank holds IBRD and IDA with IDA's HIPC and MDRI channels, and the African, Asian
# and Inter-American banks hold their concessional funds: parties name the bank for
# a contribution to its fund, as Italy's "African Development Bank" rows do for the
# African Development Fund.
#
# Names are keys as `btr_institutions.institution_key` writes them: accents
# dropped, case folded, each run of other characters than letters and digits one
# space. One name sits in one group. A name left out keeps a null group: one that
# names no single channel of the list (the ICRC, the GPE, CAFI, "IPCC/UNFCCC"), or
# a fund or initiative the list holds no code for.

