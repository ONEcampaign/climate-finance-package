# Release gate thresholds, read by `cf-build gate` and `cf-build release`. ONE sets
# these values.

# The blind sample and the sequential rule that certifies a provider's precision.
precision:
  # A provider passes when the lower bound of its interval reaches this.
  threshold: 0.90
  # Draws labelled between looks.
  batch: 50
  # Draws per provider. The last look reads them all.
  cap: 500
  # Interval widths in standard errors: at looks before the cap, and at the cap.
  interim_z: 2.5
  final_z: 1.96
  # A provider with fewer allocated pairs than this is labelled in full.
  census_below: 60
  # Draws per stratum at the least, or as many as a smaller stratum has pairs, so
  # a small stratum's own estimate rests on enough labels. The draw weights keep
  # each stratum at its value share of the estimate.
  min_draws: 50
  seed: 20261021

# Each gated stratum of each provider passes when the lower bound of its own
# interval reaches its threshold, and fails before its draws reach `min_draws` or
# the stratum's pairs. The model value is provisional and holds the provider
# threshold until a labelled blind sample sets it.
stratum_precision:
  thresholds:
    model: 0.90

# People decide at least this share of the blind sample's draws, over every
# provider; agents may decide the rest.
human_audit:
  min_share: 0.10

# Allocated plus unallocated equals each linked CRS record's disbursement.
conservation:
  tolerance_usd: 1.0e-6

# By provider and year, the raw CRS's repayments, the normalise `reflows` and the
# release `reflows` summed over every basis agree. The gap is a sum of float
# amounts, so a cent leaves room for rounding in the largest provider-years while
# a dropped repayment is far larger.
reflow_conservation:
  tolerance_usd: 0.01

# No commitment row above its face value, and few of the release's linked
# commitments whose links bring more than `raw_factor` times their face. Certain
# key-tier links put 8.5% of 2021-22 commitments over in the deterministic
# prototype and 7.9% of 2015-24 commitments in the archive build, most of them in
# single-commitment keys whose CRS disbursements exceed the commitment. The share
# stays under 10% unless a tier goes wrong at scale.
over_allocation:
  tolerance_usd: 1.0e-6
  raw_factor: 1.1
  max_share: 0.10

# Release climate commitments by provider and year against the published CRDF.
oecd_reconciliation:
  tolerance: 0.01

# Provider-year totals against the previous release. A move over `max_move` passes
# only with a cause in build.toml's `drift_causes` naming the release, the provider
# and the year.
drift:
  max_move: 0.05

# Each Eurostat sdg_13_50 line-year from 2020 to 2024 against the release
# (`reconcile_eurostat`). A gap above `min_gap_eur` and `max_gap_share` of Eurostat's
# figure passes only with an entry in build.toml's `eurostat_gaps` naming the line
# and year, and only while the gap stays within the larger of `max_move_share` of
# Eurostat's figure and `min_gap_eur` of the recorded gap. The floor leaves out the
# small members, whose lines sum to well under EUR 0.1bn a year.
eurostat_reconciliation:
  max_gap_share: 0.10
  min_gap_eur: 1.0e8
  max_move_share: 0.05
