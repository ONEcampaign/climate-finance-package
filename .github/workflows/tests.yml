name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
      # --locked fails when uv.lock is out of date with pyproject.toml, so a PR that
      # edits a dependency without relocking cannot pass.
      - run: uv sync --locked --python 3.12 --all-extras --no-extra embed --all-groups
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync ty check src
      # The alias table is baked from the locked resolvekit, so only a locked job can
      # tell a stale names.csv from a newer resolvekit.
      - run: uv run --no-sync cf-build names --check

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
      - run: uv sync --locked --python ${{ matrix.python-version }} --all-extras --no-extra embed --all-groups
      # `integration` tests reach the network; `slow` tests need real data.
      - run: uv run --no-sync pytest -m "not integration and not slow"

  lowest-direct:
    name: lowest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
      # --isolated resolves every direct dependency to its floor in pyproject.toml
      # without rewriting uv.lock.
      - run: >
          uv run --isolated --resolution lowest-direct --python 3.12 --all-extras --no-extra embed
          pytest -m "not integration and not slow"

  base-install:
    name: base install imports no build dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
      - run: uv build --wheel
      - run: uv venv --python 3.12 /tmp/base
      - run: uv pip install --python /tmp/base/bin/python dist/*.whl pytest
      # Run from tests/ so the checkout's src/ cannot shadow the installed wheel.
      - name: Run the import-boundary test
        working-directory: tests
        env:
          CF_BASE_INSTALL: "1"
        run: /tmp/base/bin/python -m pytest -p no:cacheprovider test_import_boundary.py
