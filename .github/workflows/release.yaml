name: release & publish

on:
  push:
    tags:
      - "v*"

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  release:
    name: Create Release
    needs: tests
    runs-on: ubuntu-latest

    # Matches the environment named in the PyPI trusted publisher for this
    # project. The names must agree or PyPI rejects the OIDC claim.
    environment: pypi
    permissions:
      # Declaring any permission drops the rest to none, so checkout needs
      # contents spelled out alongside the OIDC token the publish step mints.
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv (and Python)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel (uv)
        run: uv build --no-sources

      - name: Show dist/
        run: ls -l dist

      # A tag that disagrees with pyproject.toml would publish the wrong version.
      - name: Check the tag equals the package version
        run: |
          uv run --no-project python - <<'PY'
          import os
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path

          (wheel,) = Path("dist").glob("*.whl")
          with zipfile.ZipFile(wheel) as archive:
              (metadata,) = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")]
              built = BytesParser().parsebytes(archive.read(metadata))["Version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          assert built == tag, f"tag {tag} does not match the built version {built}"
          print(f"Tag and built version agree: {built}")
          PY

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verify-metadata: true
          verbose: true
